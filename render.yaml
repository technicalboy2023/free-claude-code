services:
  - type: web
    name: free-claude-code
    env: docker
    plan: free # Change this to your preferred plan if not using the free tier
    healthCheckPath: /health
    dockerCommand: uv run python server.py
    envVars:
      - key: ANTHROPIC_AUTH_TOKEN
        generateValue: true # Generates a random secure token if one is not provided
      - key: MODEL
        value: "nvidia_nim/z-ai/glm4.7" # Default model
      - key: NVIDIA_NIM_API_KEY
        sync: false # Set this securely in the Render dashboard
      # Add other provider API keys you plan to use here and set them in the dashboard:
      # - key: OPENROUTER_API_KEY
      #   sync: false
      # - key: DEEPSEEK_API_KEY
      #   sync: false
      # - key: OLLAMA_API_KEY
      #   sync: false
